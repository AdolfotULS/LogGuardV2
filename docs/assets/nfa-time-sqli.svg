<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#374151"/>
    </marker>
  </defs>

  <rect width="900" height="290" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">NFA: SQL Injection — Time Based (pgsql-time-sqli-v2)</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#64748b">Severity: High · ThreatType: SQLI · Detects: SLEEP() · pg_sleep() · BENCHMARK() · DBMS_PIPE</text>

  <!-- Entry arrow -->
  <line x1="24" y1="145" x2="56" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- q0 START -->
  <circle cx="86" cy="145" r="28" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="86" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="white">q0</text>
  <text x="86" y="154" text-anchor="middle" font-size="9" fill="#bfdbfe">start</text>

  <!-- q0→q_sel: SELECT -->
  <line x1="114" y1="145" x2="202" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="120" y="132" width="76" height="14" fill="white" rx="3"/>
  <text x="158" y="142" text-anchor="middle" font-size="10" fill="#1e293b">SELECT</text>

  <!-- q0→q_func: SLEEP / BENCHMARK (direct, arc below) -->
  <path d="M96,170 C150,220 290,220 338,172" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="175" y="213" width="130" height="14" fill="white" rx="3"/>
  <text x="240" y="223" text-anchor="middle" font-size="9" fill="#dc2626">SLEEP · BENCHMARK</text>

  <!-- q_sel -->
  <circle cx="232" cy="145" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="232" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_sel</text>
  <text x="232" y="154" text-anchor="middle" font-size="9" fill="#e5e7eb">after SELECT</text>

  <!-- q_sel→q_func: IDENT / SLEEP / BENCHMARK -->
  <line x1="260" y1="145" x2="348" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="258" y="117" width="116" height="28" fill="white" rx="3"/>
  <text x="316" y="129" text-anchor="middle" font-size="9" fill="#374151">IDENT · SLEEP</text>
  <text x="316" y="141" text-anchor="middle" font-size="9" fill="#374151">BENCHMARK</text>

  <!-- q_func -->
  <circle cx="378" cy="145" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="378" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_func</text>
  <text x="378" y="154" text-anchor="middle" font-size="9" fill="#e5e7eb">function</text>

  <!-- q_func→q_arg: LPAREN -->
  <line x1="406" y1="145" x2="494" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="411" y="132" width="78" height="14" fill="white" rx="3"/>
  <text x="450" y="142" text-anchor="middle" font-size="10" fill="#1e293b">LPAREN ( </text>

  <!-- q_arg -->
  <circle cx="524" cy="145" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="524" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_arg</text>
  <text x="524" y="154" text-anchor="middle" font-size="9" fill="#e5e7eb">arguments</text>

  <!-- q_arg self-loop: NUMBER / STRING / IDENT / COMMA / LPAREN -->
  <path d="M512,117 C504,75 544,75 536,117" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="486" y="60" width="168" height="22" fill="white" rx="3"/>
  <text x="570" y="71" text-anchor="middle" font-size="9" fill="#374151">NUMBER · STRING · IDENT</text>
  <text x="570" y="82" text-anchor="middle" font-size="9" fill="#374151">COMMA · LPAREN</text>

  <!-- q_arg→q_alert: RPAREN -->
  <line x1="552" y1="145" x2="660" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="567" y="132" width="78" height="14" fill="white" rx="3"/>
  <text x="606" y="142" text-anchor="middle" font-size="10" fill="#1e293b">RPAREN )</text>

  <!-- q_alert ACCEPT (double ring) -->
  <circle cx="698" cy="145" r="34" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="698" cy="145" r="28" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="698" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_alert</text>
  <text x="698" y="154" text-anchor="middle" font-size="9" fill="#d1fae5">ACCEPT</text>

  <!-- q_alert self-loop: SEMICOLON -->
  <path d="M686,111 C678,74 718,74 710,111" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="671" y="66" width="70" height="14" fill="white" rx="3"/>
  <text x="706" y="76" text-anchor="middle" font-size="9" fill="#374151">SEMICOLON</text>

  <!-- token mapping box -->
  <rect x="748" y="100" width="130" height="90" rx="7" fill="#fef9c3" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="813" y="117" text-anchor="middle" font-size="10" font-weight="700" fill="#78350f">SLEEP token</text>
  <text x="813" y="130" text-anchor="middle" font-size="9" fill="#92400e">maps to:</text>
  <text x="813" y="143" text-anchor="middle" font-size="9" fill="#92400e">SLEEP</text>
  <text x="813" y="155" text-anchor="middle" font-size="9" fill="#92400e">PG_SLEEP</text>
  <text x="813" y="167" text-anchor="middle" font-size="9" fill="#92400e">DBMS_PIPE</text>
  <text x="813" y="181" text-anchor="middle" font-size="9" fill="#92400e">(keyword aliases)</text>

  <!-- note -->
  <rect x="60" y="210" width="820" height="66" rx="7" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="90" y="226" font-size="10" font-weight="700" fill="#78350f">Match example 1 (bare):   SELECT pg_sleep(5)</text>
  <text x="90" y="240" font-size="10" fill="#92400e">Tokens: SELECT SLEEP LPAREN NUMBER RPAREN → q_sel→q_func (SLEEP)→q_arg (LPAREN)→q_arg (NUMBER)→q_alert (RPAREN) [ACCEPT]</text>
  <text x="90" y="256" font-size="10" font-weight="700" fill="#78350f">Match example 2 (benchmark):   SELECT BENCHMARK(1000000, MD5('test'))</text>
  <text x="90" y="270" font-size="10" fill="#92400e">Tokens: SELECT BENCHMARK LPAREN NUMBER COMMA IDENT LPAREN STRING RPAREN RPAREN → q_alert [ACCEPT]</text>
</svg>
