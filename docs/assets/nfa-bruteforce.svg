<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 310" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1020" height="310" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="510" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">NFA: Brute Force — Credential Lookup (pgsql-bruteforce-v1)</text>
  <text x="510" y="48" text-anchor="middle" font-size="11" fill="#64748b">Severity: Medium · ThreatType: BRUTEFORCE · Rate check: 5+ matches per user@host within 60s</text>

  <!-- Entry arrow to q0 -->
  <line x1="28" y1="155" x2="56" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- q0 START -->
  <circle cx="85" cy="155" r="28" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="85" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q0</text>
  <text x="85" y="164" text-anchor="middle" font-size="9" fill="#bfdbfe">start</text>

  <!-- q0→q_sel: SELECT -->
  <line x1="113" y1="155" x2="171" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="117" y="142" width="50" height="14" fill="white" rx="3"/>
  <text x="142" y="152" text-anchor="middle" font-size="10" fill="#1e293b">SELECT</text>

  <!-- q_sel -->
  <circle cx="200" cy="155" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="200" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_sel</text>
  <text x="200" y="164" text-anchor="middle" font-size="9" fill="#e5e7eb">after SELECT</text>

  <!-- q_sel self-loop (IDENT/STAR) -->
  <path d="M188,127 C180,90 220,90 212,127" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="179" y="82" width="72" height="14" fill="white" rx="3"/>
  <text x="215" y="92" text-anchor="middle" font-size="9" fill="#374151">IDENT · STAR</text>

  <!-- q_sel→q_from: FROM -->
  <line x1="228" y1="155" x2="296" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="233" y="142" width="58" height="14" fill="white" rx="3"/>
  <text x="262" y="152" text-anchor="middle" font-size="10" fill="#1e293b">FROM</text>

  <!-- q_from -->
  <circle cx="325" cy="155" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="325" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_from</text>
  <text x="325" y="164" text-anchor="middle" font-size="9" fill="#e5e7eb">after FROM</text>

  <!-- q_from→q_tbl: IDENT -->
  <line x1="353" y1="155" x2="411" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="356" y="142" width="52" height="14" fill="white" rx="3"/>
  <text x="382" y="152" text-anchor="middle" font-size="10" fill="#1e293b">IDENT</text>

  <!-- q_tbl -->
  <circle cx="440" cy="155" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="440" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_tbl</text>
  <text x="440" y="164" text-anchor="middle" font-size="9" fill="#e5e7eb">table</text>

  <!-- q_tbl→q_wh: WHERE -->
  <line x1="468" y1="155" x2="526" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="471" y="142" width="52" height="14" fill="white" rx="3"/>
  <text x="497" y="152" text-anchor="middle" font-size="10" fill="#1e293b">WHERE</text>

  <!-- q_wh -->
  <circle cx="555" cy="155" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="555" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_wh</text>
  <text x="555" y="164" text-anchor="middle" font-size="9" fill="#e5e7eb">after WHERE</text>

  <!-- q_wh→q_col: IDENT -->
  <line x1="583" y1="155" x2="641" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="586" y="142" width="52" height="14" fill="white" rx="3"/>
  <text x="612" y="152" text-anchor="middle" font-size="10" fill="#1e293b">IDENT</text>

  <!-- q_col -->
  <circle cx="670" cy="155" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="670" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_col</text>
  <text x="670" y="164" text-anchor="middle" font-size="9" fill="#e5e7eb">column</text>

  <!-- q_col→q_eq: EQUALS -->
  <line x1="698" y1="155" x2="756" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="699" y="142" width="56" height="14" fill="white" rx="3"/>
  <text x="727" y="152" text-anchor="middle" font-size="10" fill="#1e293b">EQUALS</text>

  <!-- q_eq -->
  <circle cx="785" cy="155" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="785" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_eq</text>
  <text x="785" y="164" text-anchor="middle" font-size="9" fill="#e5e7eb">after =</text>

  <!-- q_eq→q_bf: STRING -->
  <line x1="813" y1="155" x2="878" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="818" y="142" width="54" height="14" fill="white" rx="3"/>
  <text x="845" y="152" text-anchor="middle" font-size="10" fill="#1e293b">STRING</text>

  <!-- q_bf ACCEPT (double ring) -->
  <circle cx="912" cy="155" r="34" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="912" cy="155" r="28" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="912" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_bf</text>
  <text x="912" y="164" text-anchor="middle" font-size="9" fill="#d1fae5">ACCEPT</text>

  <!-- Legend / note box -->
  <rect x="60" y="215" width="880" height="78" rx="7" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="90" y="234" font-size="10" font-weight="700" fill="#78350f">Pattern matched:  SELECT [IDENT|STAR]* FROM IDENT WHERE IDENT EQUALS STRING</text>
  <text x="90" y="250" font-size="10" fill="#92400e">Example:  SELECT * FROM users WHERE username = 'admin'</text>
  <text x="90" y="265" font-size="10" fill="#92400e">Tokens:   SELECT  STAR  FROM  IDENT  WHERE  IDENT  EQUALS  STRING  →  q_bf [ACCEPT]</text>
  <text x="90" y="280" font-size="10" fill="#b45309" font-weight="600">⚠  Pattern match alone does NOT trigger alert. IsBruteForce(user@host) must confirm ≥5 matches within 60 seconds.</text>
</svg>
