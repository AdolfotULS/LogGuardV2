<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#374151"/>
    </marker>
  </defs>

  <rect width="820" height="320" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="410" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">NFA: Data Exfiltration — Bulk Dump (pgsql-exfil-v1)</text>
  <text x="410" y="48" text-anchor="middle" font-size="11" fill="#64748b">Severity: High · ThreatType: EXFIL · requireAbsentTokens: [WHERE, LIMIT]</text>

  <!-- Entry arrow -->
  <line x1="28" y1="155" x2="58" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- q0 START -->
  <circle cx="88" cy="155" r="28" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="88" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q0</text>
  <text x="88" y="164" text-anchor="middle" font-size="9" fill="#bfdbfe">start</text>

  <!-- q0→q_sel: SELECT -->
  <line x1="116" y1="155" x2="194" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="120" y="142" width="70" height="14" fill="white" rx="3"/>
  <text x="155" y="152" text-anchor="middle" font-size="10" fill="#1e293b">SELECT</text>

  <!-- q_sel -->
  <circle cx="224" cy="155" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="224" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_sel</text>
  <text x="224" y="164" text-anchor="middle" font-size="9" fill="#e5e7eb">after SELECT</text>

  <!-- q_sel self-loop: IDENT -->
  <path d="M212,127 C204,90 244,90 236,127" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="205" y="82" width="44" height="14" fill="white" rx="3"/>
  <text x="227" y="92" text-anchor="middle" font-size="9" fill="#374151">IDENT</text>

  <!-- q_sel→q_kw_from: STAR (up path) -->
  <path d="M237,130 C270,80 360,70 388,105" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="280" y="65" width="66" height="14" fill="white" rx="3"/>
  <text x="313" y="75" text-anchor="middle" font-size="10" fill="#1e293b">STAR (*)</text>

  <!-- q_sel→q_from: FROM (direct, lower path) -->
  <path d="M252,168 C310,200 390,200 448,168" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <rect x="305" y="196" width="132" height="14" fill="white" rx="3"/>
  <text x="371" y="206" text-anchor="middle" font-size="9" fill="#374151">FROM (no STAR)</text>

  <!-- q_kw_from -->
  <circle cx="420" cy="100" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="420" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="white">q_kw_from</text>
  <text x="420" y="109" text-anchor="middle" font-size="9" fill="#e5e7eb">after STAR</text>

  <!-- q_kw_from→q_from: FROM -->
  <path d="M445,112 C470,130 478,140 468,155" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="455" y="122" width="46" height="14" fill="white" rx="3"/>
  <text x="478" y="132" text-anchor="middle" font-size="10" fill="#1e293b">FROM</text>

  <!-- q_from -->
  <circle cx="476" cy="155" r="28" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
  <text x="476" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_from</text>
  <text x="476" y="164" text-anchor="middle" font-size="9" fill="#e5e7eb">after FROM</text>

  <!-- q_from→q_ex: IDENT -->
  <line x1="504" y1="155" x2="618" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="527" y="142" width="70" height="14" fill="white" rx="3"/>
  <text x="562" y="152" text-anchor="middle" font-size="10" fill="#1e293b">IDENT</text>

  <!-- q_ex ACCEPT (double ring) -->
  <circle cx="652" cy="155" r="34" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="652" cy="155" r="28" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="652" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="white">q_ex</text>
  <text x="652" y="164" text-anchor="middle" font-size="9" fill="#d1fae5">ACCEPT</text>

  <!-- absent tokens box -->
  <rect x="698" y="115" width="108" height="56" rx="7" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="752" y="133" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">BLOCKED if</text>
  <text x="752" y="147" text-anchor="middle" font-size="10" fill="#b91c1c">WHERE present</text>
  <text x="752" y="161" text-anchor="middle" font-size="10" fill="#b91c1c">LIMIT present</text>
  <line x1="698" y1="145" x2="690" y2="145" stroke="#f87171" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- note -->
  <rect x="60" y="218" width="740" height="88" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="90" y="236" font-size="10" font-weight="700" fill="#991b1b">MATCH (threat):   SELECT * FROM customers</text>
  <text x="90" y="252" font-size="10" fill="#b91c1c">Tokens: SELECT STAR FROM IDENT — no WHERE, no LIMIT → requireAbsentTokens satisfied → q_ex [ACCEPT]</text>
  <text x="90" y="270" font-size="10" font-weight="700" fill="#166534">NOT matched (safe):   SELECT * FROM customers WHERE active=1 LIMIT 100</text>
  <text x="90" y="286" font-size="10" fill="#166534">Tokens: SELECT STAR FROM IDENT WHERE IDENT EQUALS NUMBER LIMIT NUMBER</text>
  <text x="90" y="300" font-size="10" fill="#166534">NFA reaches q_ex BUT WHERE is in token set → RequireAbsentTokens check fails → IsInjected=false</text>
</svg>
