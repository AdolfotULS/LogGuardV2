<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="860" height="620" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="430" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">SqlTokenizer — 4-Phase Pipeline</text>

  <!-- Input -->
  <rect x="60" y="56" width="740" height="42" rx="7" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="140" y="73" font-size="11" font-weight="600" fill="#0c4a6e">Raw SQL Input</text>
  <text x="140" y="88" font-size="10" fill="#0369a1" font-style="italic">SE/*x*/LECT 0x55534552 FROM pg_shadow WHERE %31%3D%31 OR 'a'='a'</text>

  <line x1="430" y1="98" x2="430" y2="122" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Phase 1 -->
  <rect x="60" y="126" width="740" height="110" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="88" y="148" font-size="12" font-weight="700" fill="#713f12">Phase 1 — Normalize</text>
  <text x="88" y="163" font-size="10" fill="#854d0e">Single-pass state machine over input. No regex. Handles all encoding evasion before tokenization.</text>

  <rect x="80" y="170" width="200" height="56" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <text x="180" y="187" text-anchor="middle" font-size="10" font-weight="600" fill="#78350f">Block comment fusion</text>
  <text x="180" y="200" text-anchor="middle" font-size="9" fill="#92400e">SE/*x*/LECT → SELECT</text>
  <text x="180" y="213" text-anchor="middle" font-size="9" fill="#92400e">(no space inserted)</text>

  <rect x="294" y="170" width="180" height="56" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <text x="384" y="187" text-anchor="middle" font-size="10" font-weight="600" fill="#78350f">Hex decode</text>
  <text x="384" y="200" text-anchor="middle" font-size="9" fill="#92400e">0x55534552</text>
  <text x="384" y="213" text-anchor="middle" font-size="9" fill="#92400e">→ USER</text>

  <rect x="488" y="170" width="180" height="56" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <text x="578" y="187" text-anchor="middle" font-size="10" font-weight="600" fill="#78350f">%-decode / Unicode</text>
  <text x="578" y="200" text-anchor="middle" font-size="9" fill="#92400e">%31%3D%31 → 1=1</text>
  <text x="578" y="213" text-anchor="middle" font-size="9" fill="#92400e">S → S</text>

  <rect x="682" y="170" width="106" height="56" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <text x="735" y="187" text-anchor="middle" font-size="10" font-weight="600" fill="#78350f">Dollar-quote</text>
  <text x="735" y="200" text-anchor="middle" font-size="9" fill="#92400e">$$payload$$</text>
  <text x="735" y="213" text-anchor="middle" font-size="9" fill="#92400e">→ 'DOLLARSTR'</text>

  <text x="430" y="248" text-anchor="middle" font-size="10" fill="#78350f" font-style="italic">→ SELECT  USER  FROM pg_shadow WHERE 1=1 OR 'a'='a'</text>

  <line x1="430" y1="236" x2="430" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Phase 2 -->
  <rect x="60" y="264" width="740" height="110" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="88" y="286" font-size="12" font-weight="700" fill="#4c1d95">Phase 2 — Tautology Annotation</text>
  <text x="88" y="301" font-size="10" fill="#5b21b6">5 bounded-regex patterns. All capture groups explicitly size-limited — provably ReDoS-safe.</text>

  <rect x="80" y="308" width="132" height="56" rx="5" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
  <text x="146" y="325" text-anchor="middle" font-size="10" font-weight="600" fill="#3b0764">TautoNumEq</text>
  <text x="146" y="338" text-anchor="middle" font-size="9" fill="#4c1d95">1=1 · 42=42</text>
  <text x="146" y="351" text-anchor="middle" font-size="9" fill="#4c1d95">\b(\d{1,10})=\1\b</text>

  <rect x="226" y="308" width="132" height="56" rx="5" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
  <text x="292" y="325" text-anchor="middle" font-size="10" font-weight="600" fill="#3b0764">TautoNumGt</text>
  <text x="292" y="338" text-anchor="middle" font-size="9" fill="#4c1d95">1&gt;0 · 5&gt;0</text>
  <text x="292" y="351" text-anchor="middle" font-size="9" fill="#4c1d95">[1-9]\d{0,9}&gt;0</text>

  <rect x="372" y="308" width="132" height="56" rx="5" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
  <text x="438" y="325" text-anchor="middle" font-size="10" font-weight="600" fill="#3b0764">TautoStrEq</text>
  <text x="438" y="338" text-anchor="middle" font-size="9" fill="#4c1d95">'a'='a'</text>
  <text x="438" y="351" text-anchor="middle" font-size="9" fill="#4c1d95">'([^']{0,128})'='\1'</text>

  <rect x="518" y="308" width="132" height="56" rx="5" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
  <text x="584" y="325" text-anchor="middle" font-size="10" font-weight="600" fill="#3b0764">TautoIdentEq</text>
  <text x="584" y="338" text-anchor="middle" font-size="9" fill="#4c1d95">x=x · foo=foo</text>
  <text x="584" y="351" text-anchor="middle" font-size="9" fill="#4c1d95">\w{0,31}=\1</text>

  <rect x="664" y="308" width="124" height="56" rx="5" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1"/>
  <text x="726" y="325" text-anchor="middle" font-size="10" font-weight="600" fill="#3b0764">TautoNumNeq</text>
  <text x="726" y="338" text-anchor="middle" font-size="9" fill="#4c1d95">1&lt;&gt;2 · 1!=2</text>
  <text x="726" y="351" text-anchor="middle" font-size="9" fill="#4c1d95">(\d{1,10})&lt;&gt;…</text>

  <text x="430" y="386" text-anchor="middle" font-size="10" fill="#4c1d95" font-style="italic">→ SELECT  USER  FROM pg_shadow WHERE __TAUTO__ OR __TAUTO__</text>

  <line x1="430" y1="374" x2="430" y2="398" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Phase 3 -->
  <rect x="60" y="402" width="740" height="86" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="88" y="424" font-size="12" font-weight="700" fill="#14532d">Phase 3 — State-Machine Scanner  (no regex — ReDoS-immune)</text>
  <text x="88" y="440" font-size="10" fill="#166534">Hand-written char-by-char scanner. Single allocation pass. 160+ keyword dict lookup (case-insensitive).</text>
  <text x="88" y="456" font-size="10" fill="#166534">SELECT · FROM · IDENT · SYSTEM_TABLE · WHERE · __TAUTO__→TAUTOLOGY · OR · TAUTOLOGY</text>
  <text x="88" y="472" text-anchor="start" font-size="10" fill="#166534" font-style="italic">→  [SELECT, IDENT, FROM, SYSTEM_TABLE, WHERE, TAUTOLOGY, OR, TAUTOLOGY]</text>

  <line x1="430" y1="488" x2="430" y2="512" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Phase 4 -->
  <rect x="60" y="516" width="740" height="62" rx="7" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="88" y="538" font-size="12" font-weight="700" fill="#831843">Phase 4 — Multi-word Fusion</text>
  <text x="88" y="554" font-size="10" fill="#9d174d">UNION + ALL → UNION_ALL     INTO + OUTFILE → INTO_OUTFILE     INTO + DUMPFILE → INTO_OUTFILE     WAITFOR + DELAY → WAITFOR_DELAY</text>
  <text x="88" y="568" font-size="10" fill="#9d174d" font-style="italic">→  final: [SELECT, IDENT, FROM, SYSTEM_TABLE, WHERE, TAUTOLOGY, OR, TAUTOLOGY]</text>

  <line x1="430" y1="578" x2="430" y2="600" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output -->
  <rect x="210" y="600" width="440" height="14" rx="4" fill="#1e293b"/>
  <text x="430" y="611" text-anchor="middle" font-size="10" font-weight="600" fill="white">List&lt;string&gt; → NfaEngine[].Run(tokens)</text>
</svg>
